[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-joint-planner"
version = "0.1.0"
description = "Benchmark-faithful joint semantic-physical planning for heterogeneous agent networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "openai>=2.0,<3",
  "pillow>=11.0,<13",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
infra-joint = "infra_joint.cli:app"

[project.optional-dependencies]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "types-pyyaml>=6.0",
  "types-pillow>=10.2.0.20240822",
]

[tool.hatch.build.targets.wheel]
packages = ["src/infra_joint"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
