experiment_id: sdk-native-blind-positive-v1
source_experiment_config: configs/experiments/blind-baseline-6task-semantic-cleanup-v1.yaml
fresh_environment_config: configs/experiments/sdk-native-blind-positive-environment-v1.yaml
task: multihop-multisource
control_plane:
  implementation: openai-agents-sdk-native-tools-with-bounded-agents-as-tools
  profile_visibility: blind
  manager_model:
    base_url: https://api.deepseek.com
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
  budget:
    max_manager_turns: 12
    max_subagent_turns: 8
    max_tool_model_calls: 18
    max_created_subagents: 4
    max_active_subagents: 2
execution:
  network: native_unshaped
  scheduler: auto_physical_locality_aware
  repetitions: 1
  retry: false
  replacement: false
  worker_store_policy: isolated_fresh_processes
